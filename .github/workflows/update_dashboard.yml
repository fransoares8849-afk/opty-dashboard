name: Atualizar Dashboard SLA Opty

on:
  schedule:
    # Roda todo dia às 07:00 horário de Brasília (10:00 UTC)
    - cron: "0 10 * * 1-5"   # seg a sex

  workflow_dispatch:           # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # permite fazer commit no repo

    steps:
      # ── 1. Checkout do repositório ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Dependências ───────────────────────────────────────────────────
      - name: Instalar dependências
        run: |
          pip install pandas openpyxl playwright
          playwright install chromium --with-deps

      # ── 4. Baixar Excel do iris ───────────────────────────────────────────
      - name: Baixar Excel do iris.opty.com.br
        env:
          IRIS_EMAIL: ${{ secrets.IRIS_EMAIL }}
          IRIS_PASS:  ${{ secrets.IRIS_PASS }}
        run: |
          python baixar_excel.py relatorio.xlsx

      # ── 5. Processar e gerar index.html ───────────────────────────────────
      - name: Processar dados e atualizar dashboard
        run: |
          python processar.py relatorio.xlsx template.html index.html

      # ── 6. Commit e push ──────────────────────────────────────────────────
      - name: Commit e publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 Dashboard atualizado $(TZ='America/Sao_Paulo' date +'%d/%m/%Y %H:%M')"
          git push
